app-id: io.github.labsquare.CutePeaks
runtime: org.kde.Platform
runtime-version: '5.15-25.08'
sdk: org.kde.Sdk
command: cutepeaks
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: CutePeaks
    buildsystem: qmake
    sources:
      - type: git
        url: https://github.com/labsquare/CutePeaks.git
        tag: 0.2.3
        commit: 02779d3dafcffad226cd8b40ab0120b719af250d
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
      - type: patch
        path: patches/prefix.patch
      - type: patch
        path: patches/appstream.patch
      - type: patch
        path: patches/icon64.patch
      - type: patch
        path: patches/icon256.patch
        use-git: true
      - type: patch
        path: patches/appstream2.patch
